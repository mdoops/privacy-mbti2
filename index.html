<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>개인정보 MBTI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout concept: 문진표 한 장. 종이 한 장이 화면 가운데 놓이고, 문항은 체크하듯 고르고, 결과는 진단 소견과 처방으로 마무리한다. */
:root {
  --bg: #E9EEF2;
  --paper: #FFFFFF;
  --ink: #14212C;
  --muted: #566879;
  --line: #D3DCE4;
  --soft: #F2F6F9;
  --shadow: rgba(20, 33, 44, .28);
  --focus: #2D5BD0;
  --lock: #2D5BD0;  --lock-bg: #E5ECFB;  --lock-ink: #1F3F94;
  --note: #C98A00;  --note-bg: #FAEFCF;  --note-ink: #6F4C00;
  --kind: #CF3F65;  --kind-bg: #FADFE6;  --kind-ink: #8F2243;
  --oops: #12806F;  --oops-bg: #D9F1EC;  --oops-ink: #0B5A4E;
  --font-display: 'Do Hyeon', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141A; --paper: #151F28; --ink: #E8EEF3; --muted: #93A3B1; --line: #28384A; --soft: #1B2833;
    --shadow: rgba(0, 0, 0, .7); --focus: #86A8FF;
    --lock: #86A8FF; --lock-bg: #1B2745; --lock-ink: #BCCEFF;
    --note: #F0BC40; --note-bg: #3A2F12; --note-ink: #F6D78A;
    --kind: #F58AA6; --kind-bg: #3D1D29; --kind-ink: #FAB9CA;
    --oops: #52C9B2; --oops-bg: #11332D; --oops-ink: #9BE3D3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141A; --paper: #151F28; --ink: #E8EEF3; --muted: #93A3B1; --line: #28384A; --soft: #1B2833;
  --shadow: rgba(0, 0, 0, .7); --focus: #86A8FF;
  --lock: #86A8FF; --lock-bg: #1B2745; --lock-ink: #BCCEFF;
  --note: #F0BC40; --note-bg: #3A2F12; --note-ink: #F6D78A;
  --kind: #F58AA6; --kind-bg: #3D1D29; --kind-ink: #FAB9CA;
  --oops: #52C9B2; --oops-bg: #11332D; --oops-ink: #9BE3D3;
  color-scheme: dark;
}

[data-t="lock"] { --tc: var(--lock); --tbg: var(--lock-bg); --tink: var(--lock-ink); }
[data-t="note"] { --tc: var(--note); --tbg: var(--note-bg); --tink: var(--note-ink); }
[data-t="kind"] { --tc: var(--kind); --tbg: var(--kind-bg); --tink: var(--kind-ink); }
[data-t="oops"] { --tc: var(--oops); --tbg: var(--oops-bg); --tink: var(--oops-ink); }

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
  padding-inline: 16px;
  padding-block: 24px 48px;
}
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

.wrap { max-width: 640px; margin-inline: auto; display: grid; gap: 16px; }
.sheet {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 14px 30px -20px var(--shadow);
  overflow: hidden;
}
.sheet-head {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
  padding: 12px 20px;
  border-bottom: 1px dashed var(--line);
  font-size: 12px; color: var(--muted); letter-spacing: .04em;
}
.sheet-body { padding: 24px 20px 28px; display: grid; gap: 24px; }
.display { font-family: var(--font-display); font-weight: 400; line-height: 1.15; letter-spacing: -.005em; text-wrap: balance; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
[tabindex="-1"]:focus { outline: none; }

/* 시작 화면 */
.hero { display: grid; gap: 12px; }
.hero h1 { font-size: clamp(44px, 12vw, 64px); }
.lead { font-size: 16px; color: var(--muted); max-width: 34em; }
.types { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tcard { background: var(--tbg); color: var(--tink); border-radius: 12px; padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tcard .ico { width: 36px; height: 36px; }
.tcard b { font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1.2; }
.tcard span { font-size: 13px; line-height: 1.45; }
.label { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; margin-bottom: 10px; }
.note-small { font-size: 13px; color: var(--muted); }

.ico { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

.btn { border: 0; border-radius: 12px; padding: 13px 20px; min-height: 48px; font-size: 16px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { opacity: .9; }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn-ghost:hover { border-color: var(--ink); }
.btn-text { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 10px 4px; min-height: 44px; cursor: pointer; }
.btn-text:hover { color: var(--ink); }
.btn-text[disabled] { opacity: .35; cursor: default; }

/* 문항 화면 */
.steps { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.steps i { height: 6px; border-radius: 3px; background: var(--line); }
.steps i.done { background: var(--ink); }
.steps i.now { background: var(--muted); }
.qbox { display: grid; gap: 8px; }
.qno { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .06em; font-weight: 700; }
.q { font-size: clamp(19px, 5vw, 22px); font-weight: 700; line-height: 1.5; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  width: 100%; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start;
  text-align: left; font-size: 15px; line-height: 1.55;
  background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--ink); }
.opt .mark {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line);
  display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--muted);
}
.opt[aria-pressed="true"] { border-color: var(--ink); background: var(--soft); }
.opt[aria-pressed="true"] .mark { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.qnav { display: flex; justify-content: space-between; align-items: center; }

/* 결과 화면 */
.rhead { background: var(--tbg); color: var(--tink); padding: 24px 20px 26px; display: grid; gap: 14px; }
.rhead .eyebrow { color: var(--tink); opacity: .8; }
.rtop { display: flex; align-items: center; gap: 16px; }
.badge { flex: none; width: 76px; height: 76px; border-radius: 22px; background: var(--paper); display: grid; place-items: center; }
.badge .ico { width: 46px; height: 46px; }
.rname { font-size: clamp(32px, 9vw, 42px); }
.code { display: inline-block; margin-top: 6px; border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; letter-spacing: .14em; }
.rtag { font-size: 17px; font-weight: 500; }
.rbody { padding: 24px 20px 28px; display: grid; gap: 28px; }
.sec h2 { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .08em; margin-bottom: 10px; }
.obs { display: grid; gap: 10px; }
.obs li { position: relative; padding-left: 20px; }
.obs li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px; border-radius: 2px; background: var(--tc); }
.rx { border: 1.5px dashed var(--tc); border-radius: 14px; padding: 18px 18px 16px; position: relative; display: grid; gap: 6px; background: var(--paper); }
.rx h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: 0; color: var(--tink); margin: 0; }
.rx p { font-size: 16px; font-weight: 500; }
.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; }
.duo > div { min-width: 0; }
.duo h2 { margin-bottom: 6px; }
.dist { display: grid; gap: 10px; }
.drow { display: grid; grid-template-columns: minmax(0, 8em) minmax(0, 1fr) 3em; gap: 10px; align-items: center; font-size: 14px; }
.drow .nm { min-width: 0; }
.drow.top .nm { font-weight: 700; }
.track { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.fill { height: 100%; background: var(--tc); border-radius: 5px; min-width: 0; }
.cnt { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.status { font-size: 14px; color: var(--muted); }
.fallback { width: 100%; font: inherit; font-size: 14px; line-height: 1.55; color: var(--ink); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 130px; resize: vertical; }
.foot { font-size: 12.5px; color: var(--muted); text-align: center; padding-inline: 8px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
html{color-scheme:light}
body{margin:0}
</style>

</head>

    { q: '서류 출력을 마쳤다. 다 쓴 환자 관련 종이는?', o: [
      { t: 'note', text: '일단 책상 위에 둔다. 나중에 정리할 거다' },
      { t: 'oops', text: '복합기에 두고 온 것 같다. 아니면 가방에 있나?' },
      { t: 'kind', text: '필요하다는 동료가 있어서 그냥 넘겨준다' },
      { t: 'lock', text: '쓰자마자 세이프티 박스에 넣는다' } ] },
    { q: '급한 선생님이 환자 검사 결과를 카톡으로 보내 달라고 한다.', o: [
      { t: 'lock', text: '허용된 방법이 아니면 정중히 거절하고 다른 방법을 안내한다' },
      { t: 'kind', text: '급하다고 하시니 선생님을 믿고 보내 드린다' },
      { t: 'note', text: '개인 카톡이 제일 빠르다. 사진 한 장이면 끝난다' },
      { t: 'oops', text: '보냈는데 엉뚱한 단톡방이었다' } ] },
    { q: '엘리베이터에서 동료를 만났다. 오늘 있었던 일 이야기가 시작된다.', o: [
      { t: 'oops', text: '환자 이름까지 말했는데 뒤에 보호자분이 서 있었다' },
      { t: 'kind', text: '"그 환자분 있잖아" 하며 사연을 이야기한다. 걱정이 돼서다' },
      { t: 'lock', text: '환자가 특정될 이야기는 사무실에 가서 한다' },
      { t: 'note', text: '다들 직원인데 괜찮겠지 싶어서 편하게 말한다' } ] },
    { q: '환자 정보가 들어간 파일을 메일로 보내야 한다.', o: [
      { t: 'kind', text: '필요한 분이 많아서 요청한 분들을 모두 참조에 넣는다' },
      { t: 'note', text: '그냥 첨부해서 바로 보낸다. 일이 먼저다' },
      { t: 'oops', text: '자동완성으로 입력했더니 이름이 같은 다른 사람에게 갔다' },
      { t: 'lock', text: '암호를 걸고 수신자와 첨부 파일을 한 번 더 확인한다' } ] },
    { q: '"택배가 반송되었습니다. 주소를 확인하세요"라는 문자와 링크가 왔다.', o: [
      { t: 'note', text: '바쁜데 일단 눌러 본다. 진짜 택배일 수도 있다' },
      { t: 'kind', text: '팀 단톡방에 링크째 공유한다. 다들 조심하라는 뜻이다' },
      { t: 'oops', text: '눌러 버린 뒤에 문자를 다시 읽었다' },
      { t: 'lock', text: '주문한 적이 없으면 누르지 않고 삭제한다' } ] },
    { q: '퇴근 5분 전. 내 책상은?', o: [
      { t: 'lock', text: '서류도 USB도 서랍에 넣고 잠근다. 클린 데스크 점검 완료' },
      { t: 'oops', text: '퇴근길에 USB가 책상 위에 있다는 걸 떠올렸다' },
      { t: 'note', text: '내일 쓸 서류라서 책상 위에 두고 간다' },
      { t: 'kind', text: '후배 일을 도와주다 퇴근이 늦어졌다. 내 책상은 어제 그대로다' } ] }
  ];

  var LETTERS = ['가', '나', '다', '라'];
  var app = document.getElementById('app');
  var state = { screen: 'intro', i: 0, answers: [], busy: false };

  function icon(k) {
    return '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-' + k + '"/></svg>';
  }

  function head(left, right) {
    return '<div class="sheet-head"><span>' + left + '</span><span>' + right + '</span></div>';
  }

  function renderIntro() {
    var cards = ORDER.map(function (k) {
      var t = TYPES[k];
      return '<div class="tcard" data-t="' + k + '">' + icon(k) + '<b>' + t.name + '</b><span>' + t.short + '</span></div>';
    }).join('');
    app.innerHTML =
      head('개인정보 문진표 · 우리 병원 직원용', QUESTIONS.length + '문항 · 약 2분') +
      '<div class="sheet-body">' +
        '<div class="hero">' +
          '<p class="eyebrow">나의 개인정보 습관 진단</p>' +
          '<h1 class="display" tabindex="-1" id="focus-target">개인정보 MBTI</h1>' +
          '<p class="lead">자리를 비울 때, 전화를 받을 때, 메일을 보낼 때. 평소 습관 ' + QUESTIONS.length + '가지를 고르면 나는 어떤 유형의 개인정보 취급자인지 알려 드려요.</p>' +
        '</div>' +
        '<div><p class="label">나올 수 있는 유형 4가지</p><div class="types">' + cards + '</div></div>' +
        '<div style="display:grid;gap:10px;justify-items:start">' +
          '<button class="btn btn-primary" id="start" type="button">문진 시작하기</button>' +
          '<p class="note-small">정답은 없어요. 가장 나와 비슷한 행동을 고르세요.</p>' +
        '</div>' +
      '</div>';
    document.getElementById('start').addEventListener('click', function () {
      state = { screen: 'quiz', i: 0, answers: [], busy: false };
      render(true);
    });
  }

  function renderQuiz() {
    var n = state.i, item = QUESTIONS[n];
    var steps = QUESTIONS.map(function (_, j) {
      return '<i class="' + (j < n ? 'done' : j === n ? 'now' : '') + '"></i>';
    }).join('');
    var chosen = state.answers[n];
    var opts = item.o.map(function (o, j) {
      return '<button class="opt" type="button" data-t="' + o.t + '" aria-pressed="' + (chosen === o.t ? 'true' : 'false') + '">' +
        '<span class="mark" aria-hidden="true">' + LETTERS[j] + '</span><span>' + o.text + '</span></button>';
    }).join('');
    app.innerHTML =
      head('개인정보 문진표', '문진 ' + (n + 1) + ' / ' + QUESTIONS.length) +
      '<div class="sheet-body">' +
        '<div class="steps" aria-hidden="true">' + steps + '</div>' +
        '<div class="qbox">' +
          '<p class="qno">Q.' + String(n + 1).padStart(2, '0') + '</p>' +
          '<h2 class="q" tabindex="-1" id="focus-target">' + item.q + '</h2>' +
        '</div>' +
        '<div class="opts">' + opts + '</div>' +
        '<div class="qnav">' +
          '<button class="btn-text" id="prev" type="button"' + (n === 0 ? ' disabled' : '') + '>이전 문항</button>' +
          '<button class="btn-text" id="quit" type="button">처음으로</button>' +
        '</div>' +
      '</div>';

    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (btn) {
      btn.addEventListener('click', function () {
        if (state.busy) return;
        state.busy = true;
        state.answers[n] = btn.getAttribute('data-t');
        Array.prototype.forEach.call(app.querySelectorAll('.opt'), function (b) {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        setTimeout(function () {
          state.busy = false;
          if (n + 1 < QUESTIONS.length) { state.i = n + 1; render(true); }
          else { state.screen = 'result'; render(true); }
        }, 260);
      });
    });
    document.getElementById('prev').addEventListener('click', function () {
      if (state.i > 0) { state.i -= 1; render(true); }
    });
    document.getElementById('quit').addEventListener('click', function () {
      state = { screen: 'intro', i: 0, answers: [], busy: false };
      render(true);
    });
  }

  function tally() {
    var c = { lock: 0, note: 0, kind: 0, oops: 0 };
    state.answers.forEach(function (a) { c[a] += 1; });
    var max = Math.max(c.lock, c.note, c.kind, c.oops);
    var tied = ORDER.filter(function (k) { return c[k] === max; });
    var winner = tied[0];
    if (tied.length > 1) {
      for (var j = state.answers.length - 1; j >= 0; j--) {
        if (tied.indexOf(state.answers[j]) !== -1) { winner = state.answers[j]; break; }
      }
    }
    return { counts: c, winner: winner };
  }

  function renderResult() {
    var r = tally(), k = r.winner, t = TYPES[k];
    var obs = t.obs.map(function (s) { return '<li>' + s + '</li>'; }).join('');
    var rows = ORDER.slice().sort(function (a, b) { return r.counts[b] - r.counts[a]; }).map(function (key) {
      var pct = Math.round(r.counts[key] / QUESTIONS.length * 100);
      return '<div class="drow' + (key === k ? ' top' : '') + '" data-t="' + key + '">' +
        '<span class="nm">' + TYPES[key].name + '</span>' +
        '<span class="track"><span class="fill" style="display:block;width:' + pct + '%"></span></span>' +
        '<span class="cnt">' + r.counts[key] + '/' + QUESTIONS.length + '</span></div>';
    }).join('');

    app.innerHTML =
      head('개인정보 문진표 · 진단 결과', '작성 완료') +
      '<div class="rhead" data-t="' + k + '">' +
        '<p class="eyebrow">당신의 개인정보 유형은</p>' +
        '<div class="rtop">' +
          '<div class="badge">' + icon(k) + '</div>' +
          '<div><h1 class="display rname" tabindex="-1" id="focus-target">' + t.name + '</h1><span class="code">' + t.code + '</span></div>' +
        '</div>' +
        '<p class="rtag">' + t.short + '</p>' +
      '</div>' +
      '<div class="rbody" data-t="' + k + '">' +
        '<section class="sec"><h2>진단 소견</h2><ul class="obs">' + obs + '</ul></section>' +
        '<section class="rx"><h2>이번 주 처방</h2><p>' + t.rx + '</p></section>' +
        '<div class="duo">' +
          '<section class="sec"><h2>강점</h2><p>' + t.strength + '</p></section>' +
          '<section class="sec"><h2>이렇게 하면 더 좋아요</h2><p>' + t.caution + '</p></section>' +
        '</div>' +
        '<section class="sec"><h2>함께하면 좋은 유형</h2><p>' + t.match + '</p></section>' +
        '<section class="sec"><h2>내 응답 분포</h2><div class="dist">' + rows + '</div></section>' +
        '<div class="actions">' +
          '<button class="btn btn-primary" id="copy" type="button">결과 복사하기</button>' +
          '<button class="btn btn-ghost" id="again" type="button">다시 하기</button>' +
          '<span class="status" id="status" role="status"></span>' +
        '</div>' +
        '<div id="fb"></div>' +
      '</div>';

    var text = '나의 개인정보 MBTI는 「' + t.name + '」(' + t.code + ')\n' + t.short + '\n이번 주 처방: ' + t.rx + '\n\n우리 병원 개인정보 MBTI에서 확인했어요. 9문항, 약 2분.';
    var status = document.getElementById('status');
    document.getElementById('again').addEventListener('click', function () {
      state = { screen: 'quiz', i: 0, answers: [], busy: false };
      render(true);
    });
    document.getElementById('copy').addEventListener('click', function () {
      function fallback() {
        var fb = document.getElementById('fb');
        fb.innerHTML = '<textarea class="fallback" id="fbt" readonly aria-label="복사할 결과 글"></textarea>';
        var ta = document.getElementById('fbt');
        ta.value = text;
        ta.focus(); ta.select();
        status.textContent = '아래 글을 길게 눌러 복사하세요.';
      }
      try {
        navigator.clipboard.writeText(text).then(function () {
          status.textContent = '복사했어요. 동료에게 붙여 넣어 보세요.';
        }, fallback);
      } catch (e) { fallback(); }
    });
  }

  function render(moveFocus) {
    if (state.screen === 'intro') renderIntro();
    else if (state.screen === 'quiz') renderQuiz();
    else renderResult();
    if (moveFocus) {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      try { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
      var f = document.getElementById('focus-target');
      if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
    }
  }

  render(false);
})();
</script>

</body>
</html>
